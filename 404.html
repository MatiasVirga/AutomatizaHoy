<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0D10">
  <title>Página no encontrada | AutomatizaHoy</title>
  <meta name="robots" content="noindex">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(80% 70% at 20% 0%, #1b0a0e 0%, #0b0d10 60%);
      color: #fff;
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
      font-family: "Sora", "Inter", sans-serif;
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: -.03em;
      color: #fff;
      text-decoration: none;
    }
    .brand span { color: #ff5a73; }
    .mark {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(150deg, #e11d3c, #a60f2b);
      font-size: 18px;
    }
    .code {
      font-family: "Sora", "Inter", sans-serif;
      font-size: clamp(3.5rem, 14vw, 6rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.05em;
      color: transparent;
      background: linear-gradient(100deg, #ff6b81, #c8102e 60%, #ff9a5a);
      -webkit-background-clip: text;
      background-clip: text;
      margin: 0;
    }
    h1 {
      margin: 16px 0 10px;
      font-family: "Sora", "Inter", sans-serif;
      font-size: clamp(1.25rem, 4vw, 1.6rem);
      letter-spacing: -.02em;
    }
    p {
      margin: 0 auto 30px;
      max-width: 42ch;
      color: #9aa6b2;
      line-height: 1.6;
      font-size: .95rem;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 26px;
      border-radius: 999px;
      font-size: .92rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform .25s, box-shadow .25s;
    }
    .btn--primary {
      background: linear-gradient(135deg, #e11d3c, #b00d28);
      color: #fff;
      box-shadow: 0 14px 30px -14px rgba(200, 16, 46, .9);
    }
    .btn--ghost {
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .16);
      background: rgba(255, 255, 255, .04);
    }
    .btn:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">⚡</span>
      Automatiza<span>Hoy</span>
    </a>

    <p class="code">404</p>
    <h1>Esta página no existe (o se automatizó sola).</h1>
    <p>
      El link que seguiste no lleva a ningún lado. Volvé al inicio, mirá los casos reales o
      escribinos y lo resolvemos en un rato.
    </p>

    <div class="actions">
      <a class="btn btn--primary" href="/">Ir al inicio</a>
      <a class="btn btn--ghost" href="/#casos">Ver los casos</a>
    </div>
  </main>
</body>
</html>
