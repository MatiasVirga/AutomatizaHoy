[build]
  publish = "."
  ignore  = "exit 0"   # sin build step, solo archivos estáticos

# ── Bloquear carpetas internas (devuelven 404 si alguien adivina la URL) ──

[[redirects]]
  from   = "/Contenido/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/brand/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/docs/*"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/scripts/*"
  to     = "/404.html"
  status = 404
  force  = true

